repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: Validate uv lockfile
        entry: uv lock --check
        language: unsupported
        pass_filenames: false
        always_run: true
        fail_fast: true
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty type checking
        entry: uv run --locked ty check
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: check-yaml
        name: Check YAML
        entry: uv run --locked check-yaml
        language: unsupported
        types: [yaml]
      - id: check-toml
        name: Check TOML
        entry: uv run --locked check-toml
        language: unsupported
        types: [toml]
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: uv run --locked check-merge-conflict --assume-in-merge
        language: unsupported
        types: [text]
      - id: detect-private-key
        name: Detect private keys
        entry: uv run --locked detect-private-key
        language: unsupported
        types: [text]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: unsupported
        types: [text]
      - id: end-of-file-fixer
        name: Fix final newlines
        entry: uv run --locked end-of-file-fixer
        language: unsupported
        types: [text]
      - id: lychee
        name: Check local documentation links
        entry: lychee --offline --no-progress
        language: unsupported
        types_or: [markdown, html]
        require_serial: true
