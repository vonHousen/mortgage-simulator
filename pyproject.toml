[project]
name = "mortgage-simulator"
version = "0.1.0"
description = "A decision-support app for comparing how mortgage overpayment strategies affect cash flow, cost, and remaining principal."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "altair",
    "polars",
    "pydantic",
    "pydantic-settings",
    "streamlit",
]

[dependency-groups]
dev = [
    "mypy",
    "openpyxl",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty>=0.0.65",
    "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mortgage_simulator"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "calendar: parity checks requiring the ignored local bank schedule CSV",
    "excel: parity checks requiring the ignored local reference workbook",
    "insurance: parity checks requiring the ignored local monthly-insurance CSV",
]

[tool.coverage.run]
branch = true
source = ["mortgage_simulator"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
